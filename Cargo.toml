[package]
name = "tfd"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Pure-Rust fork of the tinyfiledialogs C library"

[dependencies]

# Windows: NO `windows` crate, and NO link-time dependency on the Win32 dialog
# DLLs. The dialog APIs (MessageBoxW, GetOpenFileNameW, SHBrowseForFolderW,
# ChooseColorW, …) are resolved at RUNTIME via LoadLibraryW + GetProcAddress
# (see src/windows.rs) and called through transmuted function pointers. The
# only link-time Win32 dependency is kernel32 (LoadLibraryW/GetProcAddress/
# FreeLibrary), whose import lib is always present — so tfd builds and links on
# every Windows target, including legacy ones like i686-rust9x that can't
# resolve the `windows` 0.48 import lib or raw-dylib against
# comdlg32/shell32/user32/ole32.

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.0"
objc2-foundation = "0.3"
# uikit-sys = "0.0.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"